<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b12">
  <title>StreamVault — Your sound library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090d;
      --bg-soft: #111118;
      --surface: rgba(22, 22, 31, .72);
      --surface-strong: rgba(30, 30, 42, .86);
      --surface-hover: rgba(42, 42, 57, .72);
      --line: rgba(255,255,255,.09);
      --line-strong: rgba(255,255,255,.16);
      --text: #f8f7fc;
      --muted: #9a98a8;
      --accent: #b38cff;
      --accent-strong: #d1b9ff;
      --accent-glow: rgba(179,140,255,.27);
      --ambient: rgba(113, 76, 190, .24);
      --radius-lg: 26px;
      --radius-md: 17px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh; overflow-x: hidden; color: var(--text);
      font-family: 'DM Sans', sans-serif; background: var(--bg);
      padding: 34px 24px 184px; transition: background .8s ease;
    }
    body::before, body::after { content: ''; position: fixed; z-index: -1; pointer-events: none; border-radius: 50%; filter: blur(80px); transition: background .8s ease, transform .8s ease; }
    body::before { width: 620px; height: 620px; top: -300px; left: calc(50% - 310px); background: var(--ambient); }
    body::after { width: 380px; height: 380px; right: -180px; bottom: 8%; background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .container { width: min(100%, 900px); margin: auto; display: flex; flex-direction: column; gap: 22px; }

    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-icon { width: 45px; height: 45px; display: grid; place-items: center; color: #0c0b12; background: var(--accent-strong); border-radius: 14px; box-shadow: 0 0 30px var(--accent-glow); transition: all .6s ease; }
    .brand-title, h2 { font-family: 'Space Grotesk', sans-serif; letter-spacing: -.045em; }
    .brand-title { font-size: 1.16rem; }
    .brand-subtitle { display: block; margin-top: 2px; color: var(--muted); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; }
    .badge { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.045); color: var(--muted); font-size: .73rem; }
    .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: #70e1ac; box-shadow: 0 0 12px #70e1ac; }

    .search-wrapper { position: relative; }
    #search-bar { width: 100%; padding: 16px 18px 16px 48px; border: 1px solid var(--line); border-radius: var(--radius-md); outline: none; color: var(--text); background: rgba(255,255,255,.055); font: inherit; transition: .25s ease; backdrop-filter: blur(20px); }
    #search-bar:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); background: var(--surface-strong); }
    #search-bar::placeholder { color: #777485; }
    .search-icon { position: absolute; left: 17px; top: 17px; width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; pointer-events: none; }

    .library-heading { display: flex; align-items: end; justify-content: space-between; padding: 14px 2px 2px; }
    .library-heading h2 { font-size: 1.7rem; }
    .library-heading p { color: var(--muted); font-size: .8rem; }
    .track-list { display: flex; flex-direction: column; gap: 9px; }
    .track-card { display: flex; align-items: center; justify-content: space-between; min-height: 74px; padding: 12px 16px; border: 1px solid transparent; border-radius: var(--radius-md); background: var(--surface); cursor: pointer; transition: transform .25s ease, background .25s ease, border-color .25s ease; backdrop-filter: blur(16px); }
    .track-card:hover { transform: translateY(-2px); background: var(--surface-hover); border-color: var(--line-strong); }
    .track-card.active { background: linear-gradient(100deg, color-mix(in srgb, var(--accent) 19%, transparent), rgba(255,255,255,.06)); border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 8px 30px color-mix(in srgb, var(--accent) 13%, transparent); }
    .track-meta { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .track-index { width: 20px; color: var(--muted); text-align: center; font-size: .76rem; font-variant-numeric: tabular-nums; }
    .album-art { width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center; border-radius: 13px; color: rgba(255,255,255,.92); background: linear-gradient(135deg, var(--art-a), var(--art-b)); font-family: 'Space Grotesk'; font-size: 1.08rem; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
    .track-title { overflow: hidden; color: var(--text); font-size: .92rem; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .track-card.active .track-title { color: var(--accent-strong); }
    .track-card > svg { margin-left: 10px; flex: 0 0 auto; stroke: var(--muted); transition: .2s ease; }
    .track-card:hover > svg, .track-card.active > svg { stroke: var(--accent-strong); transform: translateX(2px); }
    .wave-container { display: none; align-items: end; gap: 3px; width: 19px; height: 16px; }
    .track-card.active .wave-container { display: flex; }
    .track-card.active .track-index { display: none; }
    .wave-bar { width: 3px; height: 5px; border-radius: 4px; background: var(--accent); animation: wave .85s ease-in-out infinite alternate; }
    .wave-bar:nth-child(2) { height: 13px; animation-delay: .18s; }.wave-bar:nth-child(3) { height: 8px; animation-delay: .36s; }
    @keyframes wave { to { transform: scaleY(.45); } }

    .player-dock { position: fixed; z-index: 10; right: 22px; bottom: 22px; left: 22px; width: min(100% - 44px, 980px); margin: auto; padding: 17px 20px 16px; border: 1px solid var(--line-strong); border-radius: 22px; background: rgba(18,18,26,.82); box-shadow: 0 20px 70px rgba(0,0,0,.42), 0 0 50px var(--ambient); backdrop-filter: blur(28px); }
    .dock-main { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .dock-info { min-width: 0; }.dock-title { display: block; overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }.dock-status { color: var(--accent-strong); font-size: .73rem; }
    .dock-controls { display: flex; align-items: center; gap: 13px; }.ctrl-btn { display: grid; place-items: center; padding: 8px; border: 0; border-radius: 50%; color: var(--text); background: transparent; cursor: pointer; transition: transform .2s, background .2s; }.ctrl-btn:hover { transform: scale(1.08); background: rgba(255,255,255,.08); }.play-btn { width: 45px; height: 45px; color: #0d0b13; background: var(--accent-strong); box-shadow: 0 0 24px var(--accent-glow); }.play-btn:hover { background: #fff; }
    .scrubber-container { display: flex; align-items: center; gap: 11px; margin-top: 14px; }.time-label { width: 34px; color: var(--muted); font-size: .7rem; font-variant-numeric: tabular-nums; }.time-label.right { text-align: right; }
    #scrubber { width: 100%; height: 4px; appearance: none; border-radius: 10px; outline: none; cursor: pointer; background: linear-gradient(to right, var(--accent) var(--progress,0%), rgba(255,255,255,.16) var(--progress,0%)); }#scrubber::-webkit-slider-thumb { appearance: none; width: 13px; height: 13px; border: 3px solid var(--accent-strong); border-radius: 50%; background: var(--bg); box-shadow: 0 0 12px var(--accent-glow); }
    @media (max-width: 560px) { body { padding: 22px 14px 175px; }.badge { padding: 7px 9px; }.badge span:last-child { display: none; }.library-heading { align-items: start; flex-direction: column; gap: 5px; }.library-heading h2 { font-size: 1.45rem; }.player-dock { right: 12px; bottom: 12px; left: 12px; width: calc(100% - 24px); }.track-card { padding-inline: 11px; } }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="brand"><div class="brand-icon"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg></div><div><h1 class="brand-title">StreamVault</h1><span class="brand-subtitle">Your personal sound library</span></div></div>
      <div class="badge"><span class="badge-dot"></span><span>Server online</span></div>
    </header>
    <div class="search-wrapper"><input type="text" id="search-bar" placeholder="Search your library..." oninput="filterSongs()"><svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></div>
    <div class="library-heading"><h2>Library</h2><p id="library-caption">Choose a track to set the mood</p></div>
    <main class="track-list" id="song-list"><div style="color:var(--muted);text-align:center;padding:40px 0">Loading tracks...</div></main>
  </div>
  <div class="player-dock"><div class="dock-main"><div class="dock-info"><span class="dock-title" id="now-playing-title">No track selected</span><span class="dock-status" id="now-playing-status">Ready when you are</span></div><div class="dock-controls"><button class="ctrl-btn" onclick="prevSong()" title="Previous track" aria-label="Previous track"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line></svg></button><button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()" title="Play or pause" aria-label="Play or pause"><svg id="play-icon" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></button><button class="ctrl-btn" onclick="nextSong()" title="Next track" aria-label="Next track"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line></svg></button></div></div><div class="scrubber-container"><span class="time-label" id="current-time">0:00</span><input type="range" id="scrubber" min="0" max="100" value="0" aria-label="Track progress"><span class="time-label right" id="duration">0:00</span></div></div>
  <audio id="audio-player"></audio>
  <script>
    let songQueue = [], currentIndex = -1;
    const audio = document.getElementById('audio-player'), songList = document.getElementById('song-list'), searchInput = document.getElementById('search-bar'), scrubber = document.getElementById('scrubber'), currentTimeEl = document.getElementById('current-time'), durationEl = document.getElementById('duration'), titleEl = document.getElementById('now-playing-title'), statusEl = document.getElementById('now-playing-status'), captionEl = document.getElementById('library-caption');
    const playSvg = '<polygon points="5 3 19 12 5 21 5 3"></polygon>', pauseSvg = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
    const palettes = [['#7c3aed','#ec4899','#a78bfa'],['#0e7490','#22d3ee','#67e8f9'],['#be123c','#fb7185','#fda4af'],['#b45309','#f59e0b','#fcd34d'],['#166534','#34d399','#86efac'],['#4338ca','#6366f1','#a5b4fc']];
    function formatTime(secs) { if (isNaN(secs)) return '0:00'; const m = Math.floor(secs / 60), s = Math.floor(secs % 60); return `${m}:${s < 10 ? '0' : ''}${s}`; }
    function updateScrubberProgress() { scrubber.style.setProperty('--progress', `${Number(scrubber.value) || 0}%`); }
    function setMood(index) { const [a,b,c] = palettes[index % palettes.length]; document.documentElement.style.setProperty('--accent', a); document.documentElement.style.setProperty('--accent-strong', c); document.documentElement.style.setProperty('--ambient', `${a}42`); document.body.style.setProperty('--art-a', a); document.body.style.setProperty('--art-b', b); }
    async function fetchLibrary() { try { const res = await fetch('/api/songs'); songQueue = await res.json(); if (!songQueue.length) { songList.innerHTML = '<div style="color:var(--muted);text-align:center;padding:40px 0">No songs stored yet. Send MP3s to your Telegram bot.</div>'; return; } renderList(songQueue); } catch (err) { songList.innerHTML = '<div style="color:#fb7185;text-align:center;padding:40px 0">Unable to connect to streaming server.</div>'; } }
    function renderList(tracks) { songList.innerHTML = ''; tracks.forEach((song, idx) => { const card = document.createElement('div'); card.className = `track-card ${idx === currentIndex ? 'active' : ''}`; card.id = `track-${idx}`; card.style.setProperty('--art-a', palettes[idx % palettes.length][0]); card.style.setProperty('--art-b', palettes[idx % palettes.length][1]); card.onclick = () => playTrack(idx); card.innerHTML = `<div class="track-meta"><span class="track-index">${String(idx + 1).padStart(2,'0')}</span><div class="album-art" aria-hidden="true">♫</div><div class="wave-container"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div><span class="track-title"></span></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`; card.querySelector('.track-title').textContent = song.title; songList.appendChild(card); }); }
    function playTrack(idx) { if (idx < 0 || idx >= songQueue.length) return; currentIndex = idx; const song = songQueue[idx]; setMood(idx); audio.src = `/stream/${song.fileId}`; audio.play().catch(() => {}); titleEl.textContent = song.title; statusEl.textContent = 'Playing now'; captionEl.textContent = 'Now playing from your library'; document.querySelectorAll('.track-card').forEach(c => c.classList.remove('active')); document.getElementById(`track-${idx}`)?.classList.add('active'); document.getElementById('play-icon').innerHTML = pauseSvg; }
    function togglePlay() { if (currentIndex === -1 && songQueue.length) return playTrack(0); if (audio.paused) { audio.play(); document.getElementById('play-icon').innerHTML = pauseSvg; statusEl.textContent = 'Playing now'; } else { audio.pause(); document.getElementById('play-icon').innerHTML = playSvg; statusEl.textContent = 'Paused'; } }
    function nextSong() { if (songQueue.length) playTrack((currentIndex + 1) % songQueue.length); } function prevSong() { if (songQueue.length) playTrack((currentIndex - 1 + songQueue.length) % songQueue.length); }
    audio.addEventListener('timeupdate', () => { if (!isNaN(audio.duration)) { scrubber.value = audio.currentTime / audio.duration * 100; updateScrubberProgress(); currentTimeEl.textContent = formatTime(audio.currentTime); durationEl.textContent = formatTime(audio.duration); } });
    audio.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(audio.duration); scrubber.value = 0; updateScrubberProgress(); }); audio.addEventListener('ended', nextSong); scrubber.addEventListener('input', () => { updateScrubberProgress(); if (!isNaN(audio.duration)) audio.currentTime = scrubber.value / 100 * audio.duration; });
    function filterSongs() { const query = searchInput.value.toLowerCase(); songQueue.forEach((song, idx) => { const el = document.getElementById(`track-${idx}`); if (el) el.style.display = song.title.toLowerCase().includes(query) ? 'flex' : 'none'; }); }
    updateScrubberProgress(); fetchLibrary();
  </script>
</body>
</html>
