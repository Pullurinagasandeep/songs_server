<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #ffffff; margin: 0; padding: 20px; padding-bottom: 140px; }
        .container { max-width: 600px; margin: auto; }
        h1 { text-align: center; color: #1db954; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; text-align: center; background: #282828; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .tab.active { background: #1db954; color: #000; }
        .song-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #282828; margin-bottom: 8px; border-radius: 8px; }
        .song-title { flex-grow: 1; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
        .song-title:hover { color: #1db954; }
        button, select { background: #1db954; color: #000; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; outline: none; }
        select { background: #333; color: #fff; border: 1px solid #444; }
        input { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #282828; color: white; width: calc(100% - 140px); margin-right: 10px; }
        
        /* CUSTOM PLAYER STYLES */
        .player { position: fixed; bottom: 0; left: 0; right: 0; background: #181818; padding: 15px 20px; border-top: 1px solid #282828; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .now-playing-text { margin-bottom: 15px; font-size: 14px; color: #1db954; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
        .controls { display: flex; gap: 30px; align-items: center; }
        .control-btn { background: none; color: #b3b3b3; font-size: 24px; padding: 0; cursor: pointer; transition: color 0.2s; }
        .control-btn:hover { color: #ffffff; background: none; }
        .play-btn { font-size: 36px; color: #ffffff; }
        .play-btn:hover { color: #1db954; background: none; }
        
        .playlist-header { border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 25px; color: #1db954; }
    </style>
</head>
<body>
    <div class="container">
        <h1>StreamVault</h1>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('library')">Library</div>
            <div class="tab" onclick="switchTab('playlists')">My Playlists</div>
        </div>

        <div id="library-view"></div>

        <div id="playlists-view" style="display: none;">
            <div style="display: flex; margin-bottom: 20px;">
                <input type="text" id="new-playlist-name" placeholder="Name your new playlist...">
                <button onclick="createPlaylist()">Create</button>
            </div>
            <div id="playlist-container"></div>
        </div>
    </div>

    <!-- CUSTOM MUSIC PLAYER -->
    <div class="player">
        <div id="now-playing" class="now-playing-text">Ready to play</div>
        <div class="controls">
            <button class="control-btn" onclick="playPrevious()">⏮</button>
            <button id="play-pause-btn" class="control-btn play-btn" onclick="togglePlay()">▶</button>
            <button class="control-btn" onclick="playNext()">⏭</button>
        </div>
        <!-- Native audio tag is hidden -->
        <audio id="audio-player"></audio>
    </div>

    <script>
        let allSongs = [];
        let playlists = JSON.parse(localStorage.getItem('streamvault_playlists')) || {};
        
        let currentQueue = [];
        let currentQueueIndex = -1;

        const audioPlayer = document.getElementById('audio-player');
        const playPauseBtn = document.getElementById('play-pause-btn');

        // Sync Play/Pause button with actual audio state
        audioPlayer.addEventListener('play', () => playPauseBtn.innerText = '⏸');
        audioPlayer.addEventListener('pause', () => playPauseBtn.innerText = '▶');

        // Auto-play next song when current finishes
        audioPlayer.addEventListener('ended', () => {
            playNext();
        });

        async function fetchSongs() {
            try {
                const res = await fetch('/api/songs');
                allSongs = await res.json();
                renderLibrary();
                renderPlaylists();
            } catch (err) {
                document.getElementById('library-view').innerHTML = '<p>Error loading songs.</p>';
            }
        }

        function playQueueSong(index) {
            if (index < 0 || index >= currentQueue.length) return;
            
            currentQueueIndex = index;
            const song = currentQueue[index];
            
            document.getElementById('now-playing').innerText = `${song.title}`;
            audioPlayer.src = `/stream/${song.fileId}`;
            audioPlayer.play();
        }

        function playLibrarySong(index) {
            currentQueue = allSongs;
            playQueueSong(index);
        }

        function playPlaylistSong(playlistName, index) {
            currentQueue = playlists[playlistName];
            playQueueSong(index);
        }

        // CUSTOM PLAYER CONTROLS
        function togglePlay() {
            if (!audioPlayer.src) return; // Do nothing if no song is loaded
            
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        }

        function playNext() {
            if (currentQueueIndex >= 0 && currentQueueIndex < currentQueue.length - 1) {
                playQueueSong(currentQueueIndex + 1);
            } else {
                // Reached the end of the list
                audioPlayer.pause();
                document.getElementById('now-playing').innerText = "Finished";
            }
        }

        function playPrevious() {
            // If song has been playing for more than 3 seconds, restart it
            if (audioPlayer.currentTime > 3) {
                audioPlayer.currentTime = 0;
                audioPlayer.play();
            } 
            // Otherwise, go to the previous song
            else if (currentQueueIndex > 0) {
                playQueueSong(currentQueueIndex - 1);
            }
        }

        function renderLibrary() {
            const container = document.getElementById('library-view');
            container.innerHTML = '';
            
            allSongs.forEach((song, index) => {
                const div = document.createElement('div');
                div.className = 'song-item';
                
                let options = `<option value="">Add to...</option>`;
                Object.keys(playlists).forEach(pName => {
                    options += `<option value="${pName}">${pName}</option>`;
                });

                div.innerHTML = `
                    <div class="song-title" onclick="playLibrarySong(${index})">
                        ${song.title}
                    </div>
                    <select onchange="addToPlaylist('${song.fileId}', this.value); this.value='';">
                        ${options}
                    </select>
                `;
                container.appendChild(div);
            });
        }

        function renderPlaylists() {
            const container = document.getElementById('playlist-container');
            container.innerHTML = '';
            
            Object.keys(playlists).forEach(pName => {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = `<h3 class="playlist-header">${pName}</h3>`;
                
                if (playlists[pName].length === 0) {
                    wrapper.innerHTML += `<p style="color: #666; font-size: 14px;">No songs added yet.</p>`;
                }

                const safeName = pName.replace(/'/g, "\\'");

                playlists[pName].forEach((song, index) => {
                    const item = document.createElement('div');
                    item.className = 'song-item';
                    item.innerHTML = `
                        <div class="song-title" onclick="playPlaylistSong('${safeName}', ${index})">
                            ${song.title}
                        </div>
                        <button style="background: #e74c3c; color: white;" onclick="removeFromPlaylist('${song.fileId}', '${safeName}')">Remove</button>
                    `;
                    wrapper.appendChild(item);
                });
                
                container.appendChild(wrapper);
            });
        }

        function createPlaylist() {
            const name = document.getElementById('new-playlist-name').value.trim();
            if (name && !playlists[name]) {
                playlists[name] = [];
                savePlaylists();
                document.getElementById('new-playlist-name').value = '';
                renderPlaylists();
                renderLibrary();
            }
        }

        function addToPlaylist(fileId, playlistName) {
            if (!playlistName) return;
            const song = allSongs.find(s => s.fileId === fileId);
            if (song && !playlists[playlistName].find(s => s.fileId === fileId)) {
                playlists[playlistName].push(song);
                savePlaylists();
                renderPlaylists();
            }
        }

        function removeFromPlaylist(fileId, playlistName) {
            playlists[playlistName] = playlists[playlistName].filter(s => s.fileId !== fileId);
            savePlaylists();
            renderPlaylists();
            
            if (currentQueue === playlists[playlistName]) {
                currentQueue = playlists[playlistName];
            }
        }

        function savePlaylists() {
            localStorage.setItem('streamvault_playlists', JSON.stringify(playlists));
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('library-view').style.display = tab === 'library' ? 'block' : 'none';
            document.getElementById('playlists-view').style.display = tab === 'playlists' ? 'block' : 'none';
            
            if (tab === 'library') document.querySelector('.tab:nth-child(1)').classList.add('active');
            if (tab === 'playlists') document.querySelector('.tab:nth-child(2)').classList.add('active');
        }

        fetchSongs();
    </script>
</body>
</html>
