<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #181818;
            --surface-hover: #282828;
            --surface-active: rgba(29, 185, 84, 0.14);
            --border: rgba(255, 255, 255, 0.08);
            --border-active: rgba(29, 185, 84, 0.45);
            --accent: #1db954;
            --accent-bright: #1ed760;
            --accent-glow: rgba(29, 185, 84, 0.28);
            --text-main: #f8fafc;
            --text-muted: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #252525 0, #121212 360px, var(--bg) 720px);
            color: var(--text-main);
            min-height: 100vh;
            padding: 32px 24px 148px;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 50%;
            display: grid;
            place-items: center;
            box-shadow: none;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-bright);
            background: rgba(29, 185, 84, 0.1);
            border: 1px solid rgba(29, 185, 84, 0.2);
            padding: 4px 10px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        /* Search Bar */
        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2;
            pointer-events: none;
            transition: stroke 0.2s;
        }

        #search-bar {
            width: 100%;
            padding: 16px 18px 16px 48px;
            border-radius: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.95rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.2s ease;
        }

        #search-bar:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: #242424;
        }

        #search-bar:focus + .search-icon {
            stroke: var(--accent);
        }

        #search-bar::placeholder {
            color: var(--text-muted);
        }

        /* Track List */
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .library-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            margin-top: 2px;
        }

        .library-heading h2 {
            font-size: 1.25rem;
            letter-spacing: -0.04em;
        }

        .library-heading p {
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .track-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            min-height: 64px;
            border-radius: 6px;
            background: var(--surface);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .track-card:hover {
            background: var(--surface-hover);
            transform: translateY(-2px);
            border-color: transparent;
        }

        .track-card.active {
            background: var(--surface-active);
            border-color: var(--border-active);
        }

        .track-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .track-index {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            width: 20px;
            text-align: center;
        }

        .album-art {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            display: grid;
            place-items: center;
            border-radius: 3px;
            background: linear-gradient(135deg, #5038a8, #d946ef);
            color: rgba(255, 255, 255, 0.82);
            font-size: 1rem;
            font-weight: 700;
        }

        .track-card:nth-child(2n) .album-art {
            background: linear-gradient(135deg, #166534, #84cc16);
        }

        .track-card:nth-child(3n) .album-art {
            background: linear-gradient(135deg, #0e7490, #38bdf8);
        }

        .track-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-card.active .track-title {
            color: var(--accent-bright);
        }

        .track-card > svg {
            transition: transform 0.2s ease, stroke 0.2s ease;
        }

        .track-card:hover > svg {
            transform: translateX(2px);
            stroke: var(--accent-bright);
        }

        .track-card.active > svg {
            stroke: var(--accent-bright);
        }

        .wave-container {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            width: 16px;
        }

        .track-card.active .wave-container {
            display: flex;
        }

        .track-card.active .track-index {
            display: none;
        }

        .wave-bar {
            width: 3px;
            background: var(--accent);
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes wave {
            0% { height: 4px; }
            100% { height: 14px; }
        }

        /* Floating Bottom Audio Dock */
        .player-dock {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: none;
            background: #181818;
            border-top: 1px solid #282828;
            border-radius: 0;
            padding: 12px 24px 16px;
            box-shadow: 0 -8px 20px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .dock-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .dock-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .dock-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dock-status {
            font-size: 0.75rem;
            color: var(--accent-bright);
            font-weight: 500;
        }

        .dock-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-main);
            display: grid;
            place-items: center;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: transform 0.15s, opacity 0.15s;
        }

        .ctrl-btn:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        .play-btn {
            width: 42px;
            height: 42px;
            background: var(--accent-bright);
            color: #000;
            box-shadow: none;
        }

        .play-btn:hover {
            transform: scale(1.05);
            opacity: 1;
        }

        /* Scrubber Bar */
        .scrubber-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            width: 32px;
        }

        .time-label.right {
            text-align: right;
        }

        #scrubber {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: linear-gradient(
                to right,
                var(--accent) 0%,
                var(--accent) var(--progress, 0%),
                #4d4d4d var(--progress, 0%),
                #4d4d4d 100%
            );
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            transition: height 0.15s, background 0.1s linear;
        }

        #scrubber:hover {
            height: 6px;
        }

        #scrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--accent-bright);
            border-radius: 50%;
            box-shadow: none;
            opacity: 0;
            transition: transform 0.15s, opacity 0.15s;
        }

        #scrubber:hover::-webkit-slider-thumb {
            transform: scale(1.2);
            opacity: 1;
        }

        #scrubber::-moz-range-track {
            height: 4px;
            background: #4d4d4d;
            border-radius: 4px;
        }

        #scrubber::-moz-range-progress {
            height: 4px;
            background: var(--accent);
            border-radius: 4px;
        }

        #scrubber::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border: none;
            background: var(--accent-bright);
            border-radius: 50%;
            opacity: 0;
        }

        #scrubber:hover::-moz-range-thumb {
            opacity: 1;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 14px 140px;
            }

            .badge {
                font-size: 0.68rem;
                padding: 4px 8px;
            }

            .brand-subtitle {
                max-width: 150px;
            }

            .player-dock {
                padding: 12px 14px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="brand-title">StreamVault</h1>
                    <span class="brand-subtitle">Your personal sound library</span>
                </div>
            </div>
            <div class="badge">
                <span class="badge-dot"></span>
                <span>Active Server</span>
            </div>
        </header>

        <div class="search-wrapper">
            <input type="text" id="search-bar" placeholder="Search track or artist..." oninput="filterSongs()">
            <svg class="search-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>

        <div class="library-heading">
            <h2>Library</h2>
            <p>Pick a track to start listening</p>
        </div>

        <main class="track-list" id="song-list">
            <div style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 40px 0;">Loading tracks...</div>
        </main>
    </div>

    <!-- Persistent Glassmorphic Player -->
    <div class="player-dock">
        <div class="dock-main">
            <div class="dock-info">
                <span class="dock-title" id="now-playing-title">No track selected</span>
                <span class="dock-status" id="now-playing-status">Ready</span>
            </div>
            <div class="dock-controls">
                <button class="ctrl-btn" onclick="prevSong()" title="Previous Track">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
                    </svg>
                </button>
                <button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()" title="Play / Pause">
                    <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </button>
                <button class="ctrl-btn" onclick="nextSong()" title="Next Track">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
                    </svg>
                </button>
            </div>
        </div>

        <div class="scrubber-container">
            <span class="time-label" id="current-time">0:00</span>
            <input type="range" id="scrubber" min="0" max="100" value="0">
            <span class="time-label right" id="duration">0:00</span>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        let songQueue = [];
        let currentIndex = -1;
        const audio = document.getElementById('audio-player');
        const songList = document.getElementById('song-list');
        const searchInput = document.getElementById('search-bar');
        const scrubber = document.getElementById('scrubber');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const titleEl = document.getElementById('now-playing-title');
        const statusEl = document.getElementById('now-playing-status');

        const playSvg = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
        const pauseSvg = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';

        function formatTime(secs) {
            if (isNaN(secs)) return "0:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updateScrubberProgress() {
            const progress = Number(scrubber.value) || 0;
            scrubber.style.setProperty('--progress', `${progress}%`);
        }

        async function fetchLibrary() {
            try {
                const res = await fetch('/api/songs');
                songQueue = await res.json();
                
                if (songQueue.length === 0) {
                    songList.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 40px 0;">No songs stored yet. Send MP3s to your Telegram bot!</div>';
                    return;
                }

                renderList(songQueue);
            } catch (err) {
                songList.innerHTML = '<div style="color: #ef4444; text-align: center; padding: 40px 0;">Unable to connect to streaming server.</div>';
            }
        }

        function renderList(tracks) {
            songList.innerHTML = '';
            tracks.forEach((song, idx) => {
                const card = document.createElement('div');
                card.className = `track-card ${idx === currentIndex ? 'active' : ''}`;
                card.id = `track-${idx}`;
                card.onclick = () => playTrack(idx);

                card.innerHTML = `
                    <div class="track-meta">
                        <span class="track-index">${idx + 1}</span>
                        <div class="album-art" aria-hidden="true">♫</div>
                        <div class="wave-container">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                        <span class="track-title">${song.title}</span>
                    </div>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                `;
                songList.appendChild(card);
            });
        }

        function playTrack(idx) {
            if (idx < 0 || idx >= songQueue.length) return;
            currentIndex = idx;
            const song = songQueue[currentIndex];

            audio.src = `/stream/${song.fileId}`;
            audio.play();

            titleEl.innerText = song.title;
            statusEl.innerText = "Playing";
            playIcon.innerHTML = pauseSvg;

            document.querySelectorAll('.track-card').forEach(c => c.classList.remove('active'));
            const activeCard = document.getElementById(`track-${currentIndex}`);
            if (activeCard) activeCard.classList.add('active');
        }

        function togglePlay() {
            if (currentIndex === -1 && songQueue.length > 0) {
                playTrack(0);
                return;
            }
            if (audio.paused) {
                audio.play();
                playIcon.innerHTML = pauseSvg;
                statusEl.innerText = "Playing";
            } else {
                audio.pause();
                playIcon.innerHTML = playSvg;
                statusEl.innerText = "Paused";
            }
        }

        function nextSong() {
            if (songQueue.length === 0) return;
            let nextIdx = (currentIndex + 1) % songQueue.length;
            playTrack(nextIdx);
        }

        function prevSong() {
            if (songQueue.length === 0) return;
            let prevIdx = (currentIndex - 1 + songQueue.length) % songQueue.length;
            playTrack(prevIdx);
        }

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                scrubber.value = (audio.currentTime / audio.duration) * 100;
                updateScrubberProgress();
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationEl.innerText = formatTime(audio.duration);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.innerText = formatTime(audio.duration);
            scrubber.value = 0;
            updateScrubberProgress();
        });

        audio.addEventListener('ended', nextSong);

        scrubber.addEventListener('input', () => {
            updateScrubberProgress();
            if (!isNaN(audio.duration)) {
                audio.currentTime = (scrubber.value / 100) * audio.duration;
            }
        });

        function filterSongs() {
            const query = searchInput.value.toLowerCase();
            songQueue.forEach((song, idx) => {
                const el = document.getElementById(`track-${idx}`);
                if (el) {
                    el.style.display = song.title.toLowerCase().includes(query) ? 'flex' : 'none';
                }
            });
        }

        updateScrubberProgress();
        fetchLibrary();
    </script>
</body>
</html>
